name: Build fixed jar

on:
  push:
    branches: [ "fix/**" ]   # any branch named fix/..., e.g. fix/null-node-transmission-line
    tags: [ "v*" ]           # pushing a tag like v0.6.2-fix1 also creates a GitHub Release
  workflow_dispatch:         # allows running it manually from the Actions tab

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build (NeoForge)
        uses: burrunan/gradle-cache-action@v3
        with:
          job-id: jdk21
          arguments: :forge:build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: powergrid-jar
          path: forge/build/libs/powergrid-mc*-*-????????.jar
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: powergrid-jar
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
